[package]
name = "dcx-snip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DCX desktop snapshot — Win32 overlay with original vector annotation UI"
build = "build.rs"

[[bin]]
name = "dcx-snip"
path = "src/main.rs"

[dependencies]
# Only the hand-rolled Win32 layer: this crate must not link eframe/winit.
# A second event loop in one process fails (see dcx-box history), and the
# overlay needs full control of its window procedure anyway.
dcx-win32 = { path = "../dcx-win32" }

serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Anti-aliased vector rasteriser. Draws straight into the DIB section bits, so
# a frame costs no extra copy (see `surface.rs` for the channel-order note).
tiny-skia = "0.11"

# Export encoders. `png` is already in the workspace lock via dcx-island;
# `image` also decodes PNG in the `--ocr-test` / `--ocr-demo` diagnostics.
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Plugin-style HTTP providers (OpenAI-compatible / LibreTranslate / custom).
# WinHTTP itself is declared in `net.rs`, so no TLS crate is pulled in.
serde_json = "1"
base64 = "0.22"
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_WinRT",
] }
